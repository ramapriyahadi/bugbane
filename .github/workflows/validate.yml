name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch name
        if: github.event_name == 'pull_request'
        run: |
          BRANCH="${{ github.head_ref }}"
          if [[ ! "$BRANCH" =~ ^(skill|feat|fix|chore|docs)/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "ERROR: Branch '$BRANCH' must match '<prefix>/<kebab-case-topic>' where prefix is one of: skill, feat, fix, chore, docs"
            exit 1
          fi

      - name: Validate skills
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD~1"
          fi
          python3 scripts/validate_skills.py --base "$BASE"
